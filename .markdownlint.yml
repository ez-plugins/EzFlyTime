# https://github.com/DavidAnson/markdownlint
# Rules: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

default: true

# Allow longer lines in docs (URLs, tables)
MD013: false

# Allow duplicate headings in different sections
MD024:
  siblings_only: true

# Ordered list style — allow any numbering
MD029: false

# Allow inline HTML (used in Jekyll front-matter and badges)
MD033: false

# Allow first line not to be a top-level heading (front matter present)
MD041: false
