# Default Particle Shop GUI configuration
# This file defines layout and defaults for the Particle Shop GUI.
# TODO: expand with entries per particle (id, display, price, permission)

title: "Particle Shop"
rows: 3
background-item:
  material: "BLACK_STAINED_GLASS_PANE"
  display-name: " "

slots:
  10:
    id: "basic"
    material: "FEATHER"
    display-name: "Basic Flight"
    price: 100
    permission: "ezflytime.particles.basic"

  11:
    id: "vip"
    material: "NETHER_STAR"
    display-name: "VIP Flight"
    price: 1000
    permission: "ezflytime.particles.vip"

  12:
    id: "sparkle"
    material: "END_ROD"
    display-name: "Sparkle"
    price: 250
    permission: "ezflytime.particles.sparkle"

  # Additional example entries — adjust slot numbers, materials, prices, and
  # permissions to match your particle registry and permissions layout.
